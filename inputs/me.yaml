name: Carlos Payá
current_position: PhD candidate in theoretical condensed matter physics, ICMM-CSIC (Madrid, Spain)

research_summary: >
  Theoretical condensed matter physicist working on one-dimensional hybrid
  semiconductor–superconductor systems, with emphasis on full-shell nanowires.
  Combines large-scale numerical simulations with analytical modelling to study
  topological superconductivity, quantum transport and the phase structure of
  these devices. Works closely with experimental groups. Research visit to
  Karsten Flensberg's group (University of Copenhagen, 2025), where he started
  working on non-Hermitian transport in hybrid devices.

skills:
  - Large-scale numerical simulations (tight-binding, Green's functions)
  - Analytical modelling of mesoscopic superconducting devices
  - Collaboration with experimental groups

